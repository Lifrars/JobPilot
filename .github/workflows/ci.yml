name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore JobPilot.slnx

      - name: Build (warnings as errors)
        run: dotnet build JobPilot.slnx --no-restore --configuration Release

      # Los runners de GitHub traen Docker, así que Testcontainers levanta PostgreSQL + pgvector.
      - name: Test
        run: dotnet test --solution JobPilot.slnx --no-build --configuration Release
